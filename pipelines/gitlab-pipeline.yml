# ==================== NOTIFY ON FAILURE ====================
notify-failure:
  stage: notify
  image: alpine:latest
  script:
    - echo "Tests failed on branch ${CI_COMMIT_BRANCH} – Pipeline: ${CI_PIPELINE_URL}"
    # Add curl to Slack/Teams webhook here
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_JOB_STATUS == "failed"
      when: on_failure
  needs:
    - responsive-chromium
    - responsive-firefox
    - responsive-webkit
    - regression-chromium
    - regression-firefox
    - regression-webkit
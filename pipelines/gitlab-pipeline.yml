stages:
  - quality
  - smoke
  - responsive
  - regression
  - notify

variables:
  NODE_VERSION: "18"
  SELF_HEALING_ENABLED: "false"     # Set to 'true' via CI/CD variable if needed

# Cache both npm and Playwright browsers
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - ~/.cache/ms-playwright/

# ==================== QUALITY GATE (every push) ====================
lint-and-format:
  stage: quality
  image: node:${NODE_VERSION}
  script:
    - npm ci
    - npm run lint:check
    - npm run format:check
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

# ==================== SMOKE (every push) ====================
smoke-chromium:
  stage: smoke
  image: mcr.microsoft.com/playwright:latest
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - npx playwright test --project=chromium --grep "@smoke"
  artifacts:
    when: always
    paths:
      - enhanced-report/
      - playwright-report/
      - test-results/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

# ==================== RESPONSIVE (main & schedule) ====================
responsive-chromium:
  stage: responsive
  image: mcr.microsoft.com/playwright:latest
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - npx playwright test --project=chromium --grep "@responsive"
  artifacts:
    when: always
    paths:
      - enhanced-report/
      - playwright-report/
      - test-results/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

